services:
  db:
    image: postgres:16-alpine
    container_name: postiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiq}
      POSTGRES_DB: postiq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      target: runtime
    container_name: postiq-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postiq:${POSTGRES_PASSWORD:-postiq}@db:5432/postiq
    expose:
      - "8080"
    volumes:
      - postiq-downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: postiq-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  postiq-pgdata:
  postiq-downloads:
  caddy-data:
  caddy-config:
